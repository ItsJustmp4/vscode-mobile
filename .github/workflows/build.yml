name: Build VS Code Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if missing and build
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Prepare Artifacts (APK & ZIP)
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs"
            exit 1
          fi
          cp "$APK_PATH" dist/vscode-mobile.apk
          cd dist
          zip -r vscode-mobile.zip vscode-mobile.apk

      - name: Upload Release Files
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Mobile-Package
          path: dist/*
          retention-days: 14
