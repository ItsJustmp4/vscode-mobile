name: Build VS Code Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper & Build
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Artifacts (APK & ZIP)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/vscode-mobile.apk
          cd dist
          zip -r vscode-mobile.zip vscode-mobile.apk

      - name: Upload Release Files
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Mobile-Package
          path: dist/*
          retention-days: 14
